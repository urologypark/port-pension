<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>은퇴 포트폴리오 원장</title>
<style>
:root{--bg:#F4F6F8;--surface:#FFFFFF;--line:#D6DDE4;--ink:#121A22;--ink-2:#47535F;--muted:#7A8692;--accent:#1D4E89;--bad:#B8322A;
  --font:"IBM Plex Sans KR",-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#0F1419;--surface:#171E25;--line:#2C3843;--ink:#E8EDF2;--ink-2:#B3BEC9;--muted:#85919C;--accent:#7FB0EA;--bad:#EE7B72;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0F1419;--surface:#171E25;--line:#2C3843;--ink:#E8EDF2;--ink-2:#B3BEC9;--muted:#85919C;--accent:#7FB0EA;--bad:#EE7B72;color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);display:flex;align-items:center;justify-content:center;padding-inline:16px}
form{width:100%;max-width:380px;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:24px;display:flex;flex-direction:column;gap:14px}
h1{margin:0;font-size:1.25rem}
p{margin:0;color:var(--ink-2);font-size:.9rem;line-height:1.5}
label{display:flex;flex-direction:column;gap:6px;font-size:.85rem;color:var(--ink-2)}
input[type=password]{font:inherit;font-size:1rem;padding:10px 12px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--ink);width:100%}
.check{flex-direction:row;align-items:center;gap:8px}
button{font:inherit;font-size:.95rem;padding:10px;border:0;border-radius:6px;background:var(--accent);color:var(--surface);cursor:pointer}
button:disabled{opacity:.6;cursor:wait}
input:focus-visible,button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
#msg{min-height:1.2em;font-size:.85rem;color:var(--bad)}
.muted{color:var(--muted);font-size:.78rem}
</style>
</head>
<body>
<form id="f" autocomplete="off">
  <h1>은퇴 포트폴리오 원장</h1>
  <p>전체 내용(금액 포함)은 암호화되어 있습니다. 비밀번호를 넣으면 이 브라우저 안에서만 풀립니다.</p>
  <label for="pw">비밀번호<input type="password" id="pw" autocomplete="current-password" required autofocus></label>
  <label class="check" for="remember"><input type="checkbox" id="remember"> 이 기기에서 기억 (개인 기기에서만)</label>
  <button type="submit" id="go">열기</button>
  <div id="msg" role="alert"></div>
  <span class="muted">처음 여는 데 1~2초 걸립니다.</span>
</form>

const KEY_STORE="port-pension-key-v1";
const b64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
const toB64=buf=>btoa(String.fromCharCode(...new Uint8Array(buf)));
async function deriveKey(pw){
  const base=await crypto.subtle.importKey("raw",new TextEncoder().encode(pw),"PBKDF2",false,["deriveKey"]);
  return crypto.subtle.deriveKey({name:"PBKDF2",hash:"SHA-256",salt:b64(P.salt),iterations:P.iter},base,{name:"AES-GCM",length:256},true,["decrypt"]);
}
async function decryptWith(key){
  const plain=await crypto.subtle.decrypt({name:"AES-GCM",iv:b64(P.iv)},key,b64(P.ct));
  return new TextDecoder().decode(plain);
}
function show(html){document.open(); document.write(html); document.close();}
async function tryStored(){
  let raw=null; try{raw=localStorage.getItem(KEY_STORE)}catch(e){}
  if(!raw) return;
  try{const key=await crypto.subtle.importKey("raw",b64(raw),{name:"AES-GCM"},false,["decrypt"]);show(await decryptWith(key))}
  catch(e){try{localStorage.removeItem(KEY_STORE)}catch(_){}}   // 비밀번호가 바뀌었으면 기억한 키를 지움
}
document.getElementById("f").addEventListener("submit",async e=>{
  e.preventDefault(); const btn=document.getElementById("go"), msg=document.getElementById("msg");
  if(!window.crypto||!crypto.subtle){msg.textContent="이 브라우저는 암호 해제를 지원하지 않습니다. https 주소로 열어 주세요.";return}
  btn.disabled=true; msg.textContent="";
  try{
    const key=await deriveKey(document.getElementById("pw").value);
    const html=await decryptWith(key);                       // 틀린 비밀번호면 여기서 실패
    if(document.getElementById("remember").checked){try{localStorage.setItem(KEY_STORE,toB64(await crypto.subtle.exportKey("raw",key)))}catch(_){}}
    show(html);
  }catch(err){msg.textContent="비밀번호가 맞지 않습니다.";btn.disabled=false}
});
// 페이지를 다 읽은 뒤에 교체해야 잠금 화면이 남지 않음
if(document.readyState==="complete") tryStored(); else window.addEventListener("load",tryStored);
